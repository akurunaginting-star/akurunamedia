name: Akuruna Auto
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect: cek koneksi; draft: uji lengkap; auto: ikuti AUTO_MODE Cloudflare'
        type: choice
        options: [inspect, draft, auto]
        default: inspect
  schedule:
    # UTC: sekitar 08.17 dan 18.17 WIB, jadwal GitHub dapat terlambat.
    - cron: '17 1,11 * * *'
permissions:
  contents: read
concurrency:
  group: akuruna-auto
  cancel-in-progress: false
jobs:
  news:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -r automation/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTO_RUN_KEY: ${{ secrets.AUTO_RUN_KEY }}
          AUTO_BASE_URL: https://akurunamedia.id
          RUN_MODE: ${{ inputs.mode || 'auto' }}
        run: python automation/run.py --mode "$RUN_MODE"
      - name: Save result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akuruna-result-${{ github.run_id }}
          path: automation-output/
          if-no-files-found: ignore
          retention-days: 7
